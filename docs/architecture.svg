<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>ForêtAccess — architecture cible</title>
  <desc>Pipeline : données nationales IGN, prétraitement commun, quatre moteurs (skidder, porteur, camion DFCI beta, câble), le câble s'appuyant sur un noyau Rust, un service de propagation depuis la desserte partagé, la sélection des lignes câble, puis les sorties vers une base spatiale PostGIS ou GeoPackage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .arr { stroke:#73726c; stroke-width:1.5; fill:none; }
      .t   { font-size:14px; font-weight:600; }
      .s   { font-size:12px; font-weight:400; }
      .gray-b { fill:#F1EFE8; stroke:#5F5E5A; stroke-width:0.8; }
      .teal-b { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.8; }
      .coral-b{ fill:#FAECE7; stroke:#993C1D; stroke-width:1.4; }
      .gray-t { fill:#444441; } .gray-s { fill:#5F5E5A; }
      .teal-t { fill:#085041; } .teal-s { fill:#0F6E56; }
      .coral-t{ fill:#712B13; } .coral-s{ fill:#993C1D; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="560" fill="#ffffff"/>

  <rect class="gray-b" x="120" y="40" width="440" height="56" rx="8"/>
  <text class="t gray-t" x="340" y="62" text-anchor="middle" dominant-baseline="central">Données nationales IGN</text>
  <text class="s gray-s" x="340" y="80" text-anchor="middle" dominant-baseline="central">MNT 5 m · BD Forêt V2/V3 · BD Topo · parcellaire</text>

  <line x1="340" y1="96" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>

  <rect class="gray-b" x="120" y="120" width="440" height="56" rx="8"/>
  <text class="t gray-t" x="340" y="142" text-anchor="middle" dominant-baseline="central">Prétraitement commun</text>
  <text class="s gray-s" x="340" y="160" text-anchor="middle" dominant-baseline="central">pente, exposition, rasterisation, masques</text>

  <line x1="340" y1="176" x2="340" y2="188" class="arr"/>
  <line x1="109" y1="188" x2="571" y2="188" class="arr"/>
  <line x1="109" y1="188" x2="109" y2="200" class="arr" marker-end="url(#arrow)"/>
  <line x1="263" y1="188" x2="263" y2="200" class="arr" marker-end="url(#arrow)"/>
  <line x1="417" y1="188" x2="417" y2="200" class="arr" marker-end="url(#arrow)"/>
  <line x1="571" y1="188" x2="571" y2="200" class="arr" marker-end="url(#arrow)"/>

  <rect class="teal-b" x="42" y="200" width="134" height="56" rx="8"/>
  <text class="t teal-t" x="109" y="222" text-anchor="middle" dominant-baseline="central">Skidder</text>
  <text class="s teal-s" x="109" y="240" text-anchor="middle" dominant-baseline="central">50 / 100 m</text>

  <rect class="teal-b" x="196" y="200" width="134" height="56" rx="8"/>
  <text class="t teal-t" x="263" y="222" text-anchor="middle" dominant-baseline="central">Porteur</text>
  <text class="s teal-s" x="263" y="240" text-anchor="middle" dominant-baseline="central">travers 15 %</text>

  <rect class="teal-b" x="350" y="200" width="134" height="56" rx="8"/>
  <text class="t teal-t" x="417" y="222" text-anchor="middle" dominant-baseline="central">Camion DFCI</text>
  <text class="s teal-s" x="417" y="240" text-anchor="middle" dominant-baseline="central">beta · zone déf.</text>

  <rect class="teal-b" x="504" y="200" width="134" height="56" rx="8"/>
  <text class="t teal-t" x="571" y="222" text-anchor="middle" dominant-baseline="central">Câble</text>
  <text class="s teal-s" x="571" y="240" text-anchor="middle" dominant-baseline="central">360° / pixel</text>

  <line x1="109" y1="256" x2="109" y2="288" class="arr" marker-end="url(#arrow)"/>
  <line x1="263" y1="256" x2="263" y2="288" class="arr" marker-end="url(#arrow)"/>
  <line x1="417" y1="256" x2="417" y2="288" class="arr" marker-end="url(#arrow)"/>
  <line x1="571" y1="256" x2="571" y2="288" class="arr" marker-end="url(#arrow)"/>

  <rect class="gray-b" x="42" y="288" width="442" height="52" rx="8"/>
  <text class="t gray-t" x="263" y="309" text-anchor="middle" dominant-baseline="central">Propagation depuis la desserte</text>
  <text class="s gray-s" x="263" y="326" text-anchor="middle" dominant-baseline="central">least-cost · distances &amp; trajets</text>

  <rect class="coral-b" x="504" y="288" width="134" height="52" rx="8"/>
  <text class="t coral-t" x="571" y="309" text-anchor="middle" dominant-baseline="central">Noyau Rust</text>
  <text class="s coral-s" x="571" y="326" text-anchor="middle" dominant-baseline="central">CableHelp · //</text>

  <line x1="571" y1="340" x2="571" y2="376" class="arr" marker-end="url(#arrow)"/>

  <rect class="gray-b" x="504" y="376" width="134" height="52" rx="8"/>
  <text class="t gray-t" x="571" y="397" text-anchor="middle" dominant-baseline="central">Sélection</text>
  <text class="s gray-s" x="571" y="414" text-anchor="middle" dominant-baseline="central">IPC · volume</text>

  <path d="M263 340 L263 434 L300 434 L300 456" class="arr" marker-end="url(#arrow)"/>
  <path d="M571 428 L571 442 L380 442 L380 456" class="arr" marker-end="url(#arrow)"/>

  <rect class="teal-b" x="120" y="456" width="440" height="56" rx="8"/>
  <text class="t teal-t" x="340" y="478" text-anchor="middle" dominant-baseline="central">Base spatiale — foretaccess</text>
  <text class="s teal-s" x="340" y="496" text-anchor="middle" dominant-baseline="central">PostGIS (défaut) / GeoPackage · rasters COG</text>
</svg>
