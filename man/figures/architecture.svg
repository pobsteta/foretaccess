<svg width="100%" viewBox="0 0 760 600" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>ForêtAccess — architecture</title>
  <desc>Deux chaînes partant d'un prétraitement commun sur données nationales IGN. À gauche, la cartographie de l'accessibilité (moteurs terrestres skidder/porteur/DFCI et câble à noyau Rust CableHelp + SEILAPLAN, propagation depuis la desserte, sélection des lignes). À droite, la conception de desserte (surface de coût, tracé A* Rust d'après SylvaRoad et Forest Road Designer, réseau MTAP, flux et typage d'après ForestRoadNetwork, optimisation). Les deux chaînes écrivent dans une base spatiale PostGIS ou GeoPackage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .arr { stroke:#73726c; stroke-width:1.5; fill:none; }
      .t   { font-size:14px; font-weight:600; }
      .s   { font-size:11px; font-weight:400; }
      .h   { font-size:12px; font-weight:700; letter-spacing:0.3px; }
      .gray-b { fill:#F1EFE8; stroke:#5F5E5A; stroke-width:0.8; }
      .teal-b { fill:#E1F5EE; stroke:#0F6E56; stroke-width:0.8; }
      .blue-b { fill:#E6EFF7; stroke:#1F5C93; stroke-width:0.8; }
      .coral-b{ fill:#FAECE7; stroke:#993C1D; stroke-width:1.4; }
      .gray-t { fill:#444441; } .gray-s { fill:#5F5E5A; }
      .teal-t { fill:#085041; } .teal-s { fill:#0F6E56; }
      .blue-t { fill:#123F66; } .blue-s { fill:#1F5C93; }
      .coral-t{ fill:#712B13; } .coral-s{ fill:#993C1D; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="600" fill="#ffffff"/>

  <!-- Entrées + prétraitement (communs) -->
  <rect class="gray-b" x="200" y="24" width="360" height="52" rx="8"/>
  <text class="t gray-t" x="380" y="44" text-anchor="middle" dominant-baseline="central">Données nationales IGN</text>
  <text class="s gray-s" x="380" y="62" text-anchor="middle" dominant-baseline="central">MNT 5 m · BD Forêt · BD Topo · parcellaire</text>

  <line x1="380" y1="76" x2="380" y2="92" class="arr" marker-end="url(#arrow)"/>

  <rect class="gray-b" x="200" y="92" width="360" height="52" rx="8"/>
  <text class="t gray-t" x="380" y="112" text-anchor="middle" dominant-baseline="central">Prétraitement commun</text>
  <text class="s gray-s" x="380" y="130" text-anchor="middle" dominant-baseline="central">pente, exposition, rasterisation, masques</text>

  <!-- Répartition vers les deux chaînes -->
  <path d="M380 144 L380 160 L200 160 L200 210" class="arr" marker-end="url(#arrow)"/>
  <path d="M380 144 L380 160 L560 160 L560 210" class="arr" marker-end="url(#arrow)"/>

  <!-- En-têtes de chaîne -->
  <text class="h teal-t" x="200" y="184" text-anchor="middle">CARTOGRAPHIE DE L'ACCESSIBILITÉ</text>
  <text class="s teal-s" x="200" y="199" text-anchor="middle">Lots 0-13 · Sylvaccess</text>
  <text class="h blue-t" x="560" y="184" text-anchor="middle">CONCEPTION DE DESSERTE</text>
  <text class="s blue-s" x="560" y="199" text-anchor="middle">Lots 14-18</text>

  <!-- Colonne gauche : accessibilité -->
  <rect class="teal-b" x="40" y="210" width="320" height="50" rx="8"/>
  <text class="t teal-t" x="200" y="229" text-anchor="middle" dominant-baseline="central">Moteurs terrestres</text>
  <text class="s teal-s" x="200" y="246" text-anchor="middle" dominant-baseline="central">skidder · porteur · camion DFCI</text>
  <line x1="200" y1="260" x2="200" y2="276" class="arr" marker-end="url(#arrow)"/>

  <rect class="coral-b" x="40" y="276" width="320" height="50" rx="8"/>
  <text class="t coral-t" x="200" y="295" text-anchor="middle" dominant-baseline="central">Câble 360° / pixel — noyau Rust</text>
  <text class="s coral-s" x="200" y="312" text-anchor="middle" dominant-baseline="central">CableHelp · supports SEILAPLAN · rayon</text>
  <line x1="200" y1="326" x2="200" y2="342" class="arr" marker-end="url(#arrow)"/>

  <rect class="gray-b" x="40" y="342" width="320" height="50" rx="8"/>
  <text class="t gray-t" x="200" y="361" text-anchor="middle" dominant-baseline="central">Propagation · sélection des lignes</text>
  <text class="s gray-s" x="200" y="378" text-anchor="middle" dominant-baseline="central">least-cost · IPC · volume</text>

  <!-- Colonne droite : desserte -->
  <rect class="blue-b" x="400" y="210" width="320" height="46" rx="8"/>
  <text class="t blue-t" x="560" y="226" text-anchor="middle" dominant-baseline="central">Surface de coût de construction</text>
  <text class="s blue-s" x="560" y="242" text-anchor="middle" dominant-baseline="central">Lot 14 · €/m + franchissabilité</text>
  <line x1="560" y1="256" x2="560" y2="268" class="arr" marker-end="url(#arrow)"/>

  <rect class="coral-b" x="400" y="268" width="320" height="46" rx="8"/>
  <text class="t coral-t" x="560" y="284" text-anchor="middle" dominant-baseline="central">Tracé A* — noyau Rust</text>
  <text class="s coral-s" x="560" y="300" text-anchor="middle" dominant-baseline="central">Lot 15 · SylvaRoad / Forest Road Designer</text>
  <line x1="560" y1="314" x2="560" y2="326" class="arr" marker-end="url(#arrow)"/>

  <rect class="blue-b" x="400" y="326" width="320" height="46" rx="8"/>
  <text class="t blue-t" x="560" y="342" text-anchor="middle" dominant-baseline="central">Réseau MTAP glouton / Steiner</text>
  <text class="s blue-s" x="560" y="358" text-anchor="middle" dominant-baseline="central">Lot 16 · raccordement de N parcelles</text>
  <line x1="560" y1="372" x2="560" y2="384" class="arr" marker-end="url(#arrow)"/>

  <rect class="blue-b" x="400" y="384" width="320" height="46" rx="8"/>
  <text class="t blue-t" x="560" y="400" text-anchor="middle" dominant-baseline="central">Flux de bois &amp; typage des routes</text>
  <text class="s blue-s" x="560" y="416" text-anchor="middle" dominant-baseline="central">Lot 17 · ForestRoadNetwork</text>
  <line x1="560" y1="430" x2="560" y2="442" class="arr" marker-end="url(#arrow)"/>

  <rect class="blue-b" x="400" y="442" width="320" height="46" rx="8"/>
  <text class="t blue-t" x="560" y="458" text-anchor="middle" dominant-baseline="central">Optimisation du réseau</text>
  <text class="s blue-s" x="560" y="474" text-anchor="middle" dominant-baseline="central">Lot 18 · multi-start · recuit · rip-up</text>

  <!-- Sorties vers la base spatiale -->
  <path d="M200 392 L200 520 L320 520 L320 536" class="arr" marker-end="url(#arrow)"/>
  <path d="M560 488 L560 520 L440 520 L440 536" class="arr" marker-end="url(#arrow)"/>

  <rect class="gray-b" x="200" y="536" width="360" height="52" rx="8"/>
  <text class="t gray-t" x="380" y="556" text-anchor="middle" dominant-baseline="central">Base spatiale — foretaccess</text>
  <text class="s gray-s" x="380" y="574" text-anchor="middle" dominant-baseline="central">PostGIS (défaut) / GeoPackage · rasters COG</text>
</svg>
