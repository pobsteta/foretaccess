url: https://pobsteta.github.io/foretaccess

destination: pkgdown_site

template:
  bootstrap: 5

# La documentation projet (PRD, ROADMAP, ADR, brief) vit dans docs/ et n'est PAS
# la sortie pkgdown : le site est construit dans pkgdown_site/ puis déployé sur la
# branche gh-pages (cf. .github/workflows/pkgdown.yaml).

articles:
- title: Guides
  navbar: ~
  contents:
  - foretaccess
  - desserte
  - acquisition
  - cartes
  - architecture
  - choix-conception

reference:
- title: Configuration
  desc: Paramètres métier (défauts Sylvaccess v3.6), validés au chargement.
  contents:
  - foretaccess_config
  - validate_config
  - read_config
  - write_config
- title: Prétraitement (Lot 1)
  desc: Chargement, validation, alignement, pente/exposition, rasterisation.
  contents:
  - preprocess
  - valider_entrees
  - calculer_terrain
  - volume_depuis_p1
  - lire_rasters
- title: Moteurs terrestres (Lots 2-3, 6)
  desc: Skidder, porteur, camion DFCI, et leurs briques de coût/zone.
  contents:
  - skidder
  - classes_debardage
  - accessfor_correspondance
  - comparer_accessfor
  - porteur
  - camion_dfci
  - dfci_scan
  - conduire
  - treuiller
  - surface_cout_skidder
  - ponderation_pente
  - zone_roulage
  - terrain_roulable
  - zone_roulable_connectee
  - zone_treuillable
  - terrain_plat
  - zone_plate_connectee
  - coefficients_bascule
  - distance_treuillage_max
- title: Plus court chemin (service partagé)
  desc: Propagation de coût mutualisée entre moteurs.
  contents:
  - propager_cout
  - chemin_optimal
- title: Volet câble (Lots 4-5)
  desc: Potentiel de lignes (noyau Rust) et sélection multicritère.
  contents:
  - potentiel_cable
  - places_depot
  - selectionner_lignes
  - bornes_pente_cable
  - precision_cable
  - starts_with("cable_")
  - cablehelp_version
- title: Passage à l'échelle (Lot 7)
  desc: Tuilage, halo certifié, découpe d'emprise.
  contents:
  - traiter_par_tuiles
  - certifier_propagation
  - decouper_emprise
  - fenetre_tuile
- title: Base spatiale & agrégation (Lot 8)
  desc: Agrégation zonale et stockage vectoriel (PostGIS / GeoPackage).
  contents:
  - agreger_zones
  - recapituler
  - storage
  - storage_gpkg
  - storage_postgis
  - sb_write_layer
  - sb_write_layer.foretaccess_storage_postgis
  - sb_read_layer
  - sb_list_layers
  - sb_ensure_schema
- title: Acquisition depuis une AOI (Lot 10)
  desc: Téléchargement config-driven des entrées (IGN Géoplateforme, OpenStreetMap).
  contents:
  - acquire_inputs
  - cache_utilisable
  - politique_cache_valeurs
  - acquire_mnt
  - acquire_mnt_rgealti
  - acquire_desserte
  - acquire_desserte_osm
  - detecter_desserte
  - detecter_desserte_balayage
  - specs_desserte_calibrees
  - comparer_desserte_osm
  - acquire_desserte_lidar
  - qualifier_desserte
  - verifier_integrite_desserte
  - integrite_buffer_adaptatif
  - acquire_foret
  - acquire_cadastre
  - acquire_obstacles
  - acquire_obstacles_bdtopo
  - acquire_dfci
  - flag_dfci
  - datasources
  - get_country_config
  - get_data_source
  - get_layer_service
  - get_national_crs
  - list_countries
- title: Conception de desserte (Lots 14-18)
  desc: >
    Conception d'un réseau de desserte : surface de coût de construction (Lot 14),
    solveur de tracé A* (Lot 15, noyau Rust), réseau multi-cibles glouton/Steiner
    (Lot 16), vectorisation en graphe, flux de bois et typage des routes (Lot 17),
    optimisation multi-start (Lot 18).
  contents:
  - surface_cout_construction
  - tracer_desserte
  - reseau_desserte
  - contracter_lignes
  - vectoriser_reseau
  - calculer_flux
  - typer_desserte
  - optimiser_reseau
  - desserte_dist_to_end
  - desserte_trace
  - desserte_reseau
  - desserte_reseau_multistart
  - desserte_reseau_recuit
  - desserte_reseau_riprute
- title: Qualification de desserte LiDAR (spec 021)
  desc: >
    Qualification d'une desserte déclarée par LiDAR HD : canaux de micro-relief
    RVT (sky-view factor, openness ±) portés en Rust (J3). Voir aussi
    `qualifier_desserte()` dans la section Acquisition.
  contents:
  - micro_relief
  - rvt_svf_opns
- title: Composite VAT archéo (spec 021)
  desc: >
    Visualization for Archaeological Topography (Kokalj & Somrak 2019) : fusion
    RVT de plusieurs canaux de relief (SVF, openness+, pente, ombrage) en une
    image de micro-relief unique, épinglée au preset `blender_VAT.json`.
  contents:
  - vat_archeo
  - vat_combined
  - build_cvat_precomputed
  - blend_rvt
  - vat_default_layers
  - cvat_terrain_params
- title: Non-régression
  contents:
  - compare_to_oracle
