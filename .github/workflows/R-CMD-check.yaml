# CI ForêtAccess : R CMD check (+ PostGIS), lint, Rust (cargo test/clippy),
# cohérence de version. Workflows générés à la main (Lot 0, ADR-007).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Desactive la partie RESEAU de "checking CRAN incoming feasibility"
      # (--as-cran) : acces a l'index Bioconductor + verification d'URL. BioC
      # (R 4.6 -> 3.23) est injoignable ici et levait une WARNING reseau qui, avec
      # error_on="warning", faisait echouer le check. Les checks de code (non-ASCII,
      # etc.) restent actifs.
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
      # Base PostGIS jetable fournie par le service ci-dessous.
      FORETACCESS_DB_URL_TEST: "postgresql://postgres:postgres@localhost:5432/foretaccess_test"
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foretaccess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Activer l'extension PostGIS
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d foretaccess_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Tests Rust (cargo test + clippy)
        run: |
          cargo test --manifest-path src/rust/Cargo.toml
          cargo clippy --manifest-path src/rust/Cargo.toml --all-targets -- -D warnings

      # R CMD check via rcmdcheck() DIRECT plutot que check-r-package@v2, pour
      # passer `repos=` SANS Bioconductor : le paquet n'a AUCUNE dependance BioC,
      # mais "checking for unstated dependencies in tests" interroge l'index BioC
      # (R 4.6 -> BioC 3.23), injoignable ici -> WARNING reseau qui, avec
      # error_on="warning", fait echouer le check a tort. `rcmdcheck(repos=)`
      # reinitialise les repos DANS le sous-processus de check. error_on reste
      # "warning" : les vrais warnings de code (non-ASCII, etc.) echouent toujours.
      - name: R CMD check (--as-cran ; ignore les warnings d'acces reseau BioC)
        shell: Rscript {0}
        run: |
          repos <- getOption("repos")
          repos <- repos[!grepl("bioconductor", repos, ignore.case = TRUE)]
          if (!("CRAN" %in% names(repos)) || is.na(repos[["CRAN"]])) {
            repos <- c(repos, CRAN = Sys.getenv("RSPM", "https://cloud.r-project.org"))
          }
          res <- rcmdcheck::rcmdcheck(
            args = c("--no-manual", "--as-cran"),
            build_args = "--no-manual",
            error_on = "never",
            check_dir = "check",
            repos = repos)
          # Le paquet n'a AUCUNE dependance Bioconductor, mais R CMD check
          # interroge l'index BioC (R 4.6 -> BioC 3.23, injoignable ici) -> warning
          # "unable to access index for repository". On IGNORE uniquement ces
          # warnings d'acces reseau a un depot ; tout autre warning ou erreur
          # (non-ASCII, code, etc.) fait echouer la CI.
          reseau <- grepl("unable to access index for repository", res$warnings)
          warns <- res$warnings[!reseau]
          if (length(res$errors) || length(warns)) {
            cat("== ERREURS ==\n"); print(res$errors)
            cat("== WARNINGS (hors acces reseau) ==\n"); print(warns)
            quit(save = "no", status = 1L)
          }
          if (any(reseau)) {
            cat("Note: warnings d'acces reseau BioC ignores (aucune dep BioC).\n")
          }
          cat("R CMD check OK.\n")

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint
      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cohérence DESCRIPTION / NEWS / CITATION (versions stables seulement)
        shell: bash
        run: |
          VER=$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')
          # Version de dev (X.Y.Z.9000, 4 composantes) -> contrôle sauté.
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version de dev ($VER) — contrôle de cohérence sauté."
            exit 0
          fi
          NEWS=$(grep -oE '^# foretaccess [0-9]+\.[0-9]+\.[0-9]+' NEWS.md | head -1 | awk '{print $3}')
          CIT=$(grep -E '^version:' CITATION.cff | head -1 | sed 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
          if [ "$VER" != "$NEWS" ] || [ "$VER" != "$CIT" ]; then
            echo "Incohérence: DESCRIPTION=$VER NEWS=$NEWS CITATION=$CIT"
            exit 1
          fi
          echo "Versions cohérentes: $VER"
