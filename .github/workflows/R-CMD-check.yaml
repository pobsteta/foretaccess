# CI ForêtAccess : R CMD check (+ PostGIS), lint, Rust (cargo test/clippy),
# cohérence de version. Workflows générés à la main (Lot 0, ADR-007).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Base PostGIS jetable fournie par le service ci-dessous.
      FORETACCESS_DB_URL_TEST: "postgresql://postgres:postgres@localhost:5432/foretaccess_test"
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foretaccess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Activer l'extension PostGIS
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d foretaccess_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Tests Rust (cargo test + clippy)
        run: |
          cargo test --manifest-path src/rust/Cargo.toml
          cargo clippy --manifest-path src/rust/Cargo.toml --all-targets -- -D warnings

      # Retire Bioconductor des repos : le paquet n'a AUCUNE dependance BioC, mais
      # R CMD check ("unstated dependencies in tests") interroge l'index BioC ;
      # quand bioconductor.org est injoignable, cela leve une WARNING reseau qui,
      # avec error_on="warning", fait echouer le check a tort. On filtre BioC via
      # Rprofile.site (ajoute APRES la config RSPM, donc appliquee au demarrage de
      # la session de check). error_on reste "warning" -> les vrais warnings de code
      # (non-ASCII, etc.) continuent de faire echouer la CI.
      - name: Repos sans Bioconductor (evite un warning reseau BioC flaky)
        shell: Rscript {0}
        run: |
          site <- file.path(R.home("etc"), "Rprofile.site")
          cat(
            '\nlocal({',
            '  r <- getOption("repos")',
            '  if (!is.null(r) && length(r)) options(repos = r[!grepl("bioconductor", r, ignore.case = TRUE)])',
            '})\n',
            sep = "\n", file = site, append = TRUE)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint
      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cohérence DESCRIPTION / NEWS / CITATION (versions stables seulement)
        shell: bash
        run: |
          VER=$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')
          # Version de dev (X.Y.Z.9000, 4 composantes) -> contrôle sauté.
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version de dev ($VER) — contrôle de cohérence sauté."
            exit 0
          fi
          NEWS=$(grep -oE '^# foretaccess [0-9]+\.[0-9]+\.[0-9]+' NEWS.md | head -1 | awk '{print $3}')
          CIT=$(grep -E '^version:' CITATION.cff | head -1 | sed 's/^version:[[:space:]]*//' | tr -d '"' | tr -d "'" | xargs)
          if [ "$VER" != "$NEWS" ] || [ "$VER" != "$CIT" ]; then
            echo "Incohérence: DESCRIPTION=$VER NEWS=$NEWS CITATION=$CIT"
            exit 1
          fi
          echo "Versions cohérentes: $VER"
