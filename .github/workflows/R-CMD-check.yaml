# CI ForêtAccess : R CMD check (+ PostGIS), lint, Rust (cargo test/clippy),
# cohérence de version. Workflows générés à la main (Lot 0, ADR-007).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Base PostGIS jetable fournie par le service ci-dessous.
      FORETACCESS_DB_URL_TEST: "postgresql://postgres:postgres@localhost:5432/foretaccess_test"
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foretaccess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Activer l'extension PostGIS
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d foretaccess_test \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Tests Rust (cargo test + clippy)
        run: |
          cargo test --manifest-path src/rust/Cargo.toml
          cargo clippy --manifest-path src/rust/Cargo.toml --all-targets -- -D warnings

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint
      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cohérence DESCRIPTION / NEWS / CITATION (versions stables seulement)
        shell: Rscript {0}
        run: |
          desc <- read.dcf("DESCRIPTION")[, "Version"]
          if (grepl("\\.9000$|\\.9[0-9]{3}$", desc) || lengths(regmatches(desc, gregexpr("\\.", desc))) > 2) {
            cat("Version de dev (", desc, ") — contrôle de cohérence sauté.\n")
            quit(status = 0)
          }
          news <- readLines("NEWS.md")
          news_ver <- sub("^# foretaccess ([0-9.]+).*", "\\1", news[grepl("^# foretaccess [0-9]", news)][1])
          cit <- yaml::read_yaml("CITATION.cff")$version
          if (!identical(desc, news_ver) || !identical(desc, as.character(cit))) {
            stop(sprintf("Incohérence: DESCRIPTION=%s NEWS=%s CITATION=%s", desc, news_ver, cit))
          }
          cat("Versions cohérentes:", desc, "\n")
